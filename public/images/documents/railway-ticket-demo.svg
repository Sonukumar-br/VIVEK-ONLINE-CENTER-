<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 310" width="240" height="310">
  <rect x="5" y="5" width="230" height="300" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  
  <!-- Header -->
  <rect x="5" y="5" width="230" height="45" fill="#4da2ff" stroke="#000000" stroke-width="2"/>
  <text x="120" y="24" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#000000">INDIAN RAILWAYS / E-TICKETING 🚆</text>
  <text x="120" y="38" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#000000">IRCTC CONFIRMED TICKET</text>

  <!-- Ticket Info -->
  <text x="20" y="70" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">PNR NUMBER:</text>
  <text x="105" y="70" font-family="monospace" font-weight="900" font-size="11" fill="#000000">847-2910384</text>

  <text x="20" y="90" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">TRAIN NAME / NO:</text>
  <text x="105" y="90" font-family="sans-serif" font-weight="900" font-size="9" fill="#000000">EXPRESS (12345)</text>

  <text x="20" y="110" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">ROUTE:</text>
  <text x="105" y="110" font-family="sans-serif" font-weight="900" font-size="9" fill="#000000">PATNA ➔ NEW DELHI</text>

  <line x1="20" y1="125" x2="220" y2="125" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>

  <!-- Seat Box -->
  <g transform="translate(45, 145)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#ffd731" stroke="#000000" stroke-width="3"/>
    <text x="75" y="25" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#000000">STATUS: CNF / S4-32</text>
    <text x="75" y="44" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#000000">SLEEPER / AC CLASS</text>
  </g>

  <!-- Barcode -->
  <rect x="40" y="245" width="160" height="20" fill="#000000"/>
  <rect x="44" y="245" width="4" height="20" fill="#ffffff"/>
  <rect x="56" y="245" width="5" height="20" fill="#ffffff"/>
  <rect x="74" y="245" width="3" height="20" fill="#ffffff"/>
  <rect x="92" y="245" width="6" height="20" fill="#ffffff"/>
  <rect x="115" y="245" width="3" height="20" fill="#ffffff"/>
  <rect x="132" y="245" width="5" height="20" fill="#ffffff"/>
</svg>
