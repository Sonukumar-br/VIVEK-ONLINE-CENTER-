<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 310" width="240" height="310">
  <rect x="5" y="5" width="230" height="300" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  
  <!-- Header -->
  <rect x="5" y="5" width="230" height="45" fill="#55db9c" stroke="#000000" stroke-width="2"/>
  <text x="120" y="24" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#000000">DTH RECHARGE CONFIRMATION 📡</text>
  <text x="120" y="38" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#000000">DIGITAL TV SERVICE RECEIPT</text>

  <!-- Details -->
  <text x="20" y="70" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">SUBSCRIBER ID:</text>
  <text x="110" y="70" font-family="monospace" font-weight="900" font-size="10" fill="#000000">3001234567</text>

  <text x="20" y="90" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">OPERATOR:</text>
  <text x="110" y="90" font-family="sans-serif" font-weight="900" font-size="10" fill="#000000">TATA PLAY / AIRTEL DTH</text>

  <text x="20" y="110" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">RECHARGE AMOUNT:</text>
  <text x="110" y="110" font-family="monospace" font-weight="900" font-size="11" fill="#000000">₹ 499.00 / 1 MONTH</text>

  <line x1="20" y1="125" x2="220" y2="125" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>

  <!-- Satellite Icon Box -->
  <g transform="translate(120, 190)">
    <circle cx="0" cy="0" r="30" fill="#4da2ff" stroke="#000000" stroke-width="3"/>
    <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="#000000">📡</text>
  </g>

  <!-- Status Stamp -->
  <rect x="20" y="245" width="200" height="35" rx="6" fill="#ffd731" stroke="#000000" stroke-width="2"/>
  <text x="120" y="267" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#000000">RECHARGE SUCCESSFUL ✓</text>
</svg>
