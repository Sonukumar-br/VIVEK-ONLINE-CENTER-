<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 310" width="240" height="310">
  <!-- Back Paper Copy -->
  <rect x="25" y="15" width="200" height="270" rx="6" fill="#e9e9e9" stroke="#000000" stroke-width="2"/>
  
  <!-- Front Paper Copy -->
  <rect x="5" y="5" width="210" height="280" rx="6" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  
  <!-- Header -->
  <rect x="5" y="5" width="210" height="40" fill="#e9ccff" stroke="#000000" stroke-width="2"/>
  <text x="110" y="24" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#000000">HD XEROX &amp; PRINT COPY</text>
  <text x="110" y="36" font-family="sans-serif" font-weight="800" font-size="7" text-anchor="middle" fill="#000000">CLEAR BLACK &amp; WHITE / COLOR</text>

  <!-- Document Outline Lines -->
  <rect x="20" y="60" width="180" height="150" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>
  <text x="110" y="130" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#666666">XEROX DOCUMENT COPY</text>

  <!-- Stamp Seal -->
  <g transform="translate(35, 220)">
    <rect x="0" y="0" width="150" height="35" rx="6" fill="#ffd731" stroke="#000000" stroke-width="2"/>
    <text x="75" y="22" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#000000">DOUBLE-SIDE COPY ✓</text>
  </g>
</svg>
