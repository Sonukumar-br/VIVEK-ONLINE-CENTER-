  <text x="20" y="130" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">PURPOSE / उद्देश्य:</text>
  <text x="105" y="130" font-family="sans-serif" font-weight="900" font-size="9" fill="#000000">SCHOLARSHIP &amp; GOVT USE</text>

  <line x1="20" y1="145" x2="220" y2="145" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>

  <!-- Govt Seal Circle -->
  <g transform="translate(120, 195)">
    <circle cx="0" cy="0" r="32" fill="#55db9c" stroke="#000000" stroke-width="3"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#000000" stroke-dasharray="3"/>
    <text x="0" y="-8" font-family="sans-serif" font-weight="900" font-size="7" text-anchor="middle" fill="#000000">REVENUE DEPT</text>
