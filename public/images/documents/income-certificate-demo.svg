  <text x="120" y="24" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#000000">GOVERNMENT OF BIHAR</text>
  <text x="120" y="38" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#000000">INCOME CERTIFICATE / आय प्रमाण पत्र</text>

