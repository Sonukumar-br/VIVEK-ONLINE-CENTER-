  <text x="20" y="70" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">CERTIFICATE NO:</text>
  <text x="105" y="70" font-family="monospace" font-weight="900" font-size="10" fill="#000000">INC-2026-X992</text>

  <text x="20" y="90" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">NAME / नाम:</text>
  <text x="105" y="90" font-family="sans-serif" font-weight="900" font-size="10" fill="#000000">DEMO APPLICANT</text>

  <text x="20" y="110" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">ANNUAL INCOME:</text>
