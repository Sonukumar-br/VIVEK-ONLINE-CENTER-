<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 310" width="240" height="310">
  <rect x="5" y="5" width="230" height="300" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  
  <!-- Header -->
  <rect x="5" y="5" width="230" height="45" fill="#4da2ff" stroke="#000000" stroke-width="2"/>
  <text x="120" y="24" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#000000">AIRLINE BOARDING PASS ✈</text>
  <text x="120" y="38" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#000000">FLIGHT TICKET E-CONFIRMATION</text>

  <!-- Ticket Info -->
  <text x="20" y="70" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">PASSENGER NAME:</text>
  <text x="110" y="70" font-family="sans-serif" font-weight="900" font-size="10" fill="#000000">DEMO PASSENGER</text>

  <text x="20" y="90" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">FLIGHT NO:</text>
  <text x="110" y="90" font-family="monospace" font-weight="900" font-size="10" fill="#000000">AI-2026</text>

  <text x="20" y="110" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">ROUTE:</text>
  <text x="110" y="110" font-family="sans-serif" font-weight="900" font-size="9" fill="#000000">PATNA (PAT) ➔ DELHI (DEL)</text>

  <line x1="20" y1="125" x2="220" y2="125" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>

  <!-- Seat Box -->
  <g transform="translate(45, 145)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#55db9c" stroke="#000000" stroke-width="3"/>
    <text x="75" y="25" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#000000">SEAT: 14B (WINDOW)</text>
    <text x="75" y="44" font-family="sans-serif" font-weight="800" font-size="9" text-anchor="middle" fill="#000000">BOARDING GATE: G3</text>
  </g>

  <!-- Barcode -->
  <rect x="40" y="245" width="160" height="20" fill="#000000"/>
  <rect x="44" y="245" width="4" height="20" fill="#ffffff"/>
  <rect x="58" y="245" width="5" height="20" fill="#ffffff"/>
  <rect x="76" y="245" width="3" height="20" fill="#ffffff"/>
  <rect x="94" y="245" width="6" height="20" fill="#ffffff"/>
  <rect x="118" y="245" width="3" height="20" fill="#ffffff"/>
  <rect x="135" y="245" width="5" height="20" fill="#ffffff"/>
</svg>
