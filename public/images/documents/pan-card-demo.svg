<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <!-- PAN Card Outer Frame -->
  <rect x="5" y="5" width="310" height="190" rx="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  
  <!-- Header Bar -->
  <rect x="5" y="5" width="310" height="42" fill="#4da2ff" stroke="#000000" stroke-width="2"/>
  <text x="15" y="24" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">INCOME TAX DEPARTMENT</text>
  <text x="15" y="38" font-family="sans-serif" font-weight="800" font-size="9" fill="#000000">GOVT. OF INDIA</text>
  <text x="210" y="28" font-family="sans-serif" font-weight="900" font-size="12" fill="#000000">PAN CARD</text>

  <!-- Photo Box -->
  <rect x="20" y="58" width="60" height="75" rx="4" fill="#e9e9e9" stroke="#000000" stroke-width="2"/>
  <circle cx="50" cy="83" r="16" fill="#666666"/>
  <path d="M 30 125 C 30 102, 70 102, 70 125 Z" fill="#666666"/>
  <text x="50" y="148" font-family="sans-serif" font-weight="700" font-size="7" text-anchor="middle" fill="#000000">DEMO PHOTO</text>

  <!-- Content Fields -->
  <text x="95" y="68" font-family="sans-serif" font-weight="800" font-size="9" fill="#555555">NAME / नाम</text>
  <text x="95" y="82" font-family="sans-serif" font-weight="900" font-size="12" fill="#000000">DEMO USER</text>

  <text x="95" y="100" font-family="sans-serif" font-weight="800" font-size="9" fill="#555555">FATHER'S NAME / पिता का नाम</text>
  <text x="95" y="114" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">SAMPLE FATHER</text>

  <text x="95" y="132" font-family="sans-serif" font-weight="800" font-size="9" fill="#555555">DATE OF BIRTH / जन्म तिथि</text>
  <text x="95" y="146" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">01/01/1990</text>

  <!-- PAN Number Footer -->
  <rect x="15" y="158" width="290" height="30" rx="6" fill="#ffd731" stroke="#000000" stroke-width="2"/>
  <text x="30" y="178" font-family="monospace" font-weight="900" font-size="15" letter-spacing="3" fill="#000000">ABCDE1234F</text>

  <!-- QR Code Box Placeholder -->
  <rect x="255" y="60" width="45" height="45" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="260" y="65" width="12" height="12" fill="#000000"/>
  <rect x="283" y="65" width="12" height="12" fill="#000000"/>
  <rect x="260" y="88" width="12" height="12" fill="#000000"/>
  <rect x="277" y="82" width="8" height="8" fill="#000000"/>
</svg>
