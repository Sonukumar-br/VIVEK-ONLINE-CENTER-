<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 310" width="240" height="310">
  <rect x="5" y="5" width="230" height="300" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  
  <!-- Header -->
  <rect x="5" y="5" width="230" height="45" fill="#ffd731" stroke="#000000" stroke-width="2"/>
  <text x="120" y="24" font-family="sans-serif" font-weight="900" font-size="11" text-anchor="middle" fill="#000000">ELECTRICITY BILL RECEIPT ⚡</text>
  <text x="120" y="38" font-family="sans-serif" font-weight="800" font-size="8" text-anchor="middle" fill="#000000">STATE POWER DISTRIBUTION CORP</text>

  <!-- Bill Information -->
  <text x="20" y="70" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">CONSUMER NO (CA):</text>
  <text x="115" y="70" font-family="monospace" font-weight="900" font-size="10" fill="#000000">1029384756</text>

  <text x="20" y="90" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">CONSUMER NAME:</text>
  <text x="115" y="90" font-family="sans-serif" font-weight="900" font-size="10" fill="#000000">DEMO CONSUMER</text>

  <text x="20" y="110" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">BILL MONTH:</text>
  <text x="115" y="110" font-family="sans-serif" font-weight="900" font-size="10" fill="#000000">OCTOBER 2026</text>

  <line x1="20" y1="125" x2="220" y2="125" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>

  <!-- Energy Meter Icon Box -->
  <rect x="20" y="140" width="200" height="50" rx="6" fill="#e9e9e9" stroke="#000000" stroke-width="2"/>
  <circle cx="50" cy="165" r="16" fill="#ffd731" stroke="#000000" stroke-width="2"/>
  <text x="50" y="170" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle" fill="#000000">⚡</text>

  <text x="80" y="158" font-family="sans-serif" font-weight="800" font-size="8" fill="#666666">TOTAL AMOUNT DUE:</text>
  <text x="80" y="176" font-family="monospace" font-weight="900" font-size="15" fill="#000000">₹ 1,450.00</text>

  <!-- Stamp Paid Seal -->
  <g transform="translate(45, 205)">
    <rect x="0" y="0" width="150" height="40" rx="8" fill="#55db9c" stroke="#000000" stroke-width="3"/>
    <text x="75" y="25" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle" fill="#000000">PAID IN FULL ✓</text>
  </g>

  <!-- Barcode -->
  <rect x="40" y="265" width="160" height="20" fill="#000000"/>
  <rect x="44" y="265" width="4" height="20" fill="#ffffff"/>
  <rect x="55" y="265" width="6" height="20" fill="#ffffff"/>
  <rect x="70" y="265" width="2" height="20" fill="#ffffff"/>
  <rect x="85" y="265" width="5" height="20" fill="#ffffff"/>
  <rect x="100" y="265" width="4" height="20" fill="#ffffff"/>
  <rect x="120" y="265" width="3" height="20" fill="#ffffff"/>
  <rect x="140" y="265" width="6" height="20" fill="#ffffff"/>
